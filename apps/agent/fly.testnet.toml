# The testnet worker.
#
# **Named for its network on purpose.** The product runs one worker process per
# chain — the free tier lives on testnet permanently while paid agents trade on
# mainnet — and the two differ in exactly the settings that decide whether real
# money moves. A single `fly.toml` with the network swapped in place is one
# careless edit away from pointing a live-trading config at mainnet, so a
# mainnet worker means writing `fly.mainnet.toml` deliberately. DEPLOYMENT.md
# lists what has to differ in it.
#
# **Deploy from the repository root**, not from this directory:
#
#   fly deploy . --ha=false -c apps/agent/fly.testnet.toml
#
# The build context is the working directory, and the Dockerfile copies the
# lockfile and `packages/shared` from the root — it cannot build with
# `apps/agent` as its context.
#
# **The two paths below are measured from different places, and that is not a
# mistake here.** Measured by execution 2026-08-17: `dockerfile` is resolved
# against the directory holding *this file*, not against the working directory,
# and not against whatever `fly deploy [WORKING_DIRECTORY]` is given — passing
# the root explicitly changed nothing. It said `apps/agent/Dockerfile` until
# then, which flyctl turned into `apps/agent/apps/agent/Dockerfile` and reported
# as a missing file. `release_command` further down is different again: it runs
# inside the image, so it is relative to the image's WORKDIR.

app = "puno-worker-testnet"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

# Runs on its own machine before the new version takes traffic, so a deploy
# whose migration fails does not half-replace a running worker. Relative to the
# image's WORKDIR (/app/apps/agent), not to this file. `db:migrate` needs only
# DATABASE_URL — every other variable in the worker's schema is optional or
# defaulted (apps/agent/src/config.ts).
[deploy]
release_command = "node --import tsx src/db/migrate.ts"

[env]
NETWORK = "testnet"

# Explicit, and only safe because this file is testnet-only. The demo agent
# does place real testnet trades, so the free tier needs this false — but
# DRY_RUN defaults to **true** in config.ts precisely so a missing or malformed
# value can never silently enable live trading. Writing it here is a statement
# about this chain, not a default for another one to inherit.
DRY_RUN = "false"

# Mock oracles go stale an hour after anyone last set them, which made the demo
# agent refuse to trade and explain itself — correctly, and as a first
# impression. Testnet-only by construction: `isTestnet` is false on mainnet and
# `demoVault` is null there.
TESTNET_PRICE_KEEPER = "true"

# One machine, never two. `tickAllAgents()` walks every live agent with no
# lease or lock, so a second instance ticks the same agents concurrently:
# double screening charges against one balance, and two racing trades out of
# one vault.
#
# **This block does not enforce that.** Fly provisions two machines by default
# for availability, and there is no machine-count field in fly.toml — it is a
# deploy-time flag. Every deploy must carry `--ha=false`:
#
#   fly apps create puno-worker-testnet          # once, and it touches nothing here
#   fly deploy . --ha=false -c apps/agent/fly.testnet.toml
#
# For a stateless web service the default is a good one. For this worker it is
# a correctness bug that bills users twice, which is why it is written here
# rather than left to whoever reads the Fly docs.
#
# **Do not create the app with `fly launch`.** It treats this file as its own
# output: run once on 2026-08-17 it rewrote `app` to a generated name and
# deleted every comment here, including the paragraph above — the one thing in
# this file that cannot be recovered by reading the settings. `apps create`
# does not write a fly.toml at all.
[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

# No [processes] block: the image's CMD already starts the worker as PID 1, and
# restating it here would be a second place to keep it right.
#
# No [http_service] either. The worker serves nothing; it polls. Fly restarts
# the machine when the process exits, which is the only liveness signal that
# exists today — a wedged-but-running worker would go unnoticed. Worth a health
# endpoint before this carries paying users; see DEPLOYMENT.md.
